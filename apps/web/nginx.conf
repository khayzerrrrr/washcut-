# ---------- HTTP: ACME challenge + redirect ke HTTPS ----------
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/washcut.prospecta.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/washcut.prospecta.web.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API ke service "api" di network docker-compose
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
